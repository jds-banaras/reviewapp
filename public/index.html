<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Review JDS Banaras</title>
  <meta name="description" content="Share your experience at JDS Banaras on Google.">
  <meta name="theme-color" content="#2e221c">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <img src="logo.png" alt="JDS Banaras" class="logo" width="112" height="112">
      <p class="tagline" id="tagline">Handwoven Banarasi heritage</p>
    </header>

    <section class="card" aria-labelledby="rate-title">
      <h1 id="rate-title">How was your visit?</h1>

      <div class="stars" role="radiogroup" aria-label="Your rating" id="stars"></div>

      <p class="label">What did you shop for?</p>
      <div class="chips" id="categories" role="radiogroup" aria-label="Category"></div>

      <div class="draft-head">
        <p class="label">Suggested review <span class="muted">· edit freely</span></p>
        <div class="lang" id="languages" role="radiogroup" aria-label="Language"></div>
      </div>

      <div class="draft">
        <textarea id="draft" rows="5" aria-label="Your review text" spellcheck="true"></textarea>
        <button type="button" class="refresh" id="refresh" aria-label="Suggest a different review" title="Suggest another">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <button type="button" class="primary" id="post">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Copy &amp; post on Google
      </button>

      <ol class="steps">
        <li>Your review is copied</li>
        <li>Google opens: tap the stars</li>
        <li>Long-press, paste, and post</li>
      </ol>

      <a class="own" id="own" href="#" rel="noopener">Prefer to write your own? Open Google reviews</a>
    </section>

    <nav class="links" id="links" aria-label="Follow us"></nav>

    <footer class="foot">Thank you for supporting Banarasi weavers</footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JDS Review Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <style>
    @page { size: A6 portrait; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #ddd; font-family: "Jost", sans-serif; }
    .card {
      width: 105mm; height: 148mm; margin: 12px auto; background: #2e221c; color: #c9a45c;
      display: flex; flex-direction: column; align-items: center; padding: 8mm 8mm 6mm; text-align: center;
    }
    .logo { width: 30mm; height: 30mm; border-radius: 4mm; }
    h1 { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 21pt; margin: 3mm 0 1mm; line-height: 1.05; }
    .sub { font-size: 9pt; color: #e9dcc4; margin: 0 0 4mm; }
    .qr { position: relative; background: #fff; padding: 3mm; border-radius: 3mm; }
    .qr img.code { width: 52mm; height: 52mm; display: block; }
    .qr img.badge { position: absolute; left: 50%; top: 50%; width: 12mm; height: 12mm; transform: translate(-50%, -50%); border-radius: 2mm; border: 1mm solid #fff; }
    .google { margin-top: 4mm; display: flex; align-items: center; gap: 2mm; color: #fff; font-size: 11pt; font-weight: 500; }
    .stars { color: #fbbc04; letter-spacing: 1px; font-size: 13pt; }
    .foot { margin-top: auto; font-size: 7.5pt; color: rgba(201,164,92,.8); }
    @media print { body { background: none; } .card { margin: 0; } .hint { display: none; } }
    .hint { text-align: center; font-size: 13px; color: #444; margin: 12px 16px; }
  </style>
</head>
<body>
  <p class="hint">Run <code>npm run qr -- &lt;your site URL&gt;</code> first, then print this page at 100% scale on A6 (or A5 with two copies).</p>
  <div class="card">
    <img class="logo" src="logo.png" alt="JDS Banaras">
    <h1>Loved your visit?</h1>
    <p class="sub">Scan to share a quick review on Google</p>
    <div class="qr">
      <img class="code" src="qr.svg" alt="QR code to the review page">
      <img class="badge" src="logo.png" alt="">
    </div>
    <div class="google"><span>Google</span><span class="stars">★★★★★</span></div>
    <p class="foot">Your words help Banarasi weavers reach more people</p>
  </div>
</body>
</html>
